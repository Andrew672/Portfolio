<div class="fixed inset-0 w-full h-full overflow-hidden -z-10 pointer-events-none bg-slate-950">
  <div class="absolute top-0 -left-4 w-96 h-96 bg-teal-900/40 rounded-full mix-blend-screen filter blur-[120px] opacity-30 animate-blob"></div>
  <div class="absolute top-0 -right-4 w-96 h-96 bg-indigo-900/40 rounded-full mix-blend-screen filter blur-[120px] opacity-30 animate-blob [animation-delay:2s]"></div>
  <div class="absolute -bottom-32 left-20 w-96 h-96 bg-slate-800/40 rounded-full mix-blend-screen filter blur-[120px] opacity-30 animate-blob [animation-delay:4s]"></div>
</div>

<div class="fixed top-6 right-6 z-50 flex gap-3">
  <button (click)="toggleLanguage()" class="group relative flex items-center justify-center w-12 h-12 bg-white/5 backdrop-blur-md border border-white/10 rounded-full hover:bg-white/10 hover:scale-110 hover:border-teal-500/50 transition-all duration-300 shadow-[0_4px_30px_rgba(0,0,0,0.1)] overflow-hidden cursor-pointer">
    <div class="absolute inset-0 bg-gradient-to-tr from-teal-500/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
    <span class="text-slate-300 group-hover:text-white relative z-10 font-bold uppercase text-sm">
      {{ locale.substring(0, 2) === 'fr' ? 'EN' : 'FR' }}
    </span>
  </button>

  <a href="https://github.com/andrew672" target="_blank" class="group relative flex items-center justify-center w-12 h-12 bg-white/5 backdrop-blur-md border border-white/10 rounded-full hover:bg-white/10 hover:scale-110 hover:border-teal-500/50 transition-all duration-300 shadow-[0_4px_30px_rgba(0,0,0,0.1)] overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-tr from-teal-500/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-300 group-hover:text-white relative z-10"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
  </a>

  <a href="https://linkedin.com/in/andrew-marbach" target="_blank" class="group relative flex items-center justify-center w-12 h-12 bg-white/5 backdrop-blur-md border border-white/10 rounded-full hover:bg-white/10 hover:scale-110 hover:border-teal-500/50 transition-all duration-300 shadow-[0_4px_30px_rgba(0,0,0,0.1)] overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-tr from-teal-500/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-300 group-hover:text-white relative z-10"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
  </a>
</div>

<main class="h-[100dvh] w-full overflow-y-scroll snap-y snap-mandatory scroll-smooth relative no-scrollbar">
  
  <div class="snap-start snap-always h-[100dvh] w-full flex items-center justify-center relative overflow-hidden">
    <app-welcome class="w-full h-full block"></app-welcome>
  </div>

  <div class="snap-start snap-always min-h-[100dvh] w-full flex items-center justify-center relative">
    <app-projects class="w-full h-full block"></app-projects>
  </div>



  <div class="snap-start h-screen w-full flex items-center justify-center">
    <app-experience class="w-full h-full block"></app-experience>
  </div>
  <!-- 
  <div class="snap-start h-screen w-full flex items-center justify-center">
    <app-skills class="w-full h-full block"></app-skills>
  </div> -->

</main>
